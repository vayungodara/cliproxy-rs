[package]
name = "cliproxy"
description = "Use DeepSeek, GLM, Kimi, OpenRouter and more in Codex CLI and Claude Code: one local endpoint with API translation and failover. CLIProxyAPI-compatible."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
exclude.workspace = true
readme = "../../README.md"
keywords = ["llm", "proxy", "openai", "claude-code", "codex"]
categories = ["command-line-utilities", "network-programming", "web-programming::http-server"]

# cargo binstall installs the GitHub release archive for the host target.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/cliproxy-{ version }-{ target }{ archive-suffix }"
bin-dir = "cliproxy-{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[dependencies]
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
cpa-common.workspace = true
cpa-core.workspace = true
cpa-exec.workspace = true
cpa-home.workspace = true
cpa-plugin.workspace = true
cpa-server.workspace = true
cpa-store.workspace = true
getrandom = "0.3"
libc.workspace = true
# The -tui management client: the crossterm backend only.
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
serde_json.workspace = true
serde_yaml_ng.workspace = true
# `all` for SO_REUSEPORT, which Go sets on mDNS sockets outside Linux.
socket2 = { workspace = true, features = ["all"] }
tokio.workspace = true
tracing.workspace = true
tokio-util = "0.7"
futures-util.workspace = true
# Already in the tree through axum and cpa-server; the heap-trim response hook.
http-body = "1"
tower = { version = "0.5", features = ["util"] }
# Already in the tree through cpa-exec; the TUI client follows redirects itself.
url = "2"
# The TUI's management API client.
wreq.workspace = true

[dev-dependencies]
cpa-plugin = { workspace = true, features = ["test-support"] }
cpa-home = { workspace = true, features = ["fake"] }
