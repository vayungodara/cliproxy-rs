[package]
name = "cpa-exec"
description = "Upstream provider executors for cliproxy-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
bytes.workspace = true
cpa-common.workspace = true
cpa-core.workspace = true
cpa-translate.workspace = true
futures-util.workspace = true
http.workspace = true
wreq = { workspace = true, features = ["socks", "ws"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util = { version = "0.7", features = ["io"] }
async-compression = { version = "0.4", features = ["tokio", "gzip", "zstd", "brotli", "zlib", "deflate"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
getrandom = "0.3"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "v5"] }
url = "2"
httpdate = "1"
tiktoken-rs = "0.7"
# Gemini: Go-encoded white PNGs for image aspect-ratio requests.
flate2 = "1"
# Codex: raw JSON reads for byte-preserving request edits, config document access, logs.
gjson = "0.8.1"
regex = "1"
serde_yaml_ng.workspace = true
tracing.workspace = true
libc.workspace = true
# Codex: brotli certificate decompression for the Chrome TLS profile (already in the graph).
brotli-decompressor = "6"

[dev-dependencies]
axum = { workspace = true, features = ["ws"] }
