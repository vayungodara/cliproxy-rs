[package]
name = "cpa-exec"
description = "Upstream provider executors for cliproxy-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
bytes.workspace = true
cpa-common.workspace = true
cpa-core.workspace = true
cpa-translate.workspace = true
futures-util.workspace = true
http.workspace = true
wreq = { workspace = true, features = ["socks"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util = { version = "0.7", features = ["io"] }
async-compression = { version = "0.4", features = ["tokio", "gzip", "zstd", "brotli", "zlib", "deflate"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
getrandom = "0.3"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "v5"] }
url = "2"
httpdate = "1"
tiktoken-rs = "0.7"
libc.workspace = true
gjson = "0.8.1"
regex = "1"
serde_yaml_ng.workspace = true
tracing.workspace = true

[dev-dependencies]
axum.workspace = true
