[package]
name = "cpa-core"
description = "Shared contracts for cliproxy-rs: config, credentials, formats and the execution envelope"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# Lets a test install a plugin auth parser for its own thread only
# (`credentials::with_thread_plugin_auth_parser`), so tests sharing a process do not see it.
test-support = []

[dependencies]
anyhow.workspace = true
bytes.workspace = true
futures-util.workspace = true
http.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
serde_yaml_ng.workspace = true
# serde_yaml_ng's parser; its events carry the resolved tags that serde drops.
unsafe-libyaml = "0.2.11"
tracing.workspace = true
base64 = "0.22"
bcrypt = "0.19"
sha2 = "0.10"
yaml-edit = "0.3.2"
