[package]
name = "cpa-server"
description = "HTTP surface of cliproxy-rs: routes, client auth, runtime and credential selection"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
axum = { workspace = true, features = ["ws"] }
bytes.workspace = true
btls = "0.5.6"
cpa-common.workspace = true
cpa-core.workspace = true
cpa-exec.workspace = true
cpa-translate.workspace = true
futures-util.workspace = true
gjson = "0.8.1"
regex = "1"
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
tokio.workspace = true
tokio-btls = "0.5.6"
tracing.workspace = true
tracing-subscriber.workspace = true
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
bcrypt = "0.19"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
getrandom = "0.3"
sha2 = "0.10"
subtle = "2.6"
wreq.workspace = true
# The live call body reports whether it reached the connection (realtime/http.rs).
http-body = "1"
# Codex Live WebRTC media relay (codex.live-media-relay), a pion port; ring crypto keeps
# a second BoringSSL out of the binary. Off by default.
webrtc = { version = "0.21", default-features = false, features = ["runtime-tokio", "crypto-ring"], optional = true }
# The relay names webrtc's codec and RTP types, which live in its private `rtc` core.
rtc = { version = "0.21", default-features = false, features = ["crypto-ring"], optional = true }
async-trait = { version = "0.1", optional = true }

[features]
media-relay = ["dep:webrtc", "dep:rtc", "dep:async-trait"]

[dev-dependencies]
url = "2"
tokio = { workspace = true, features = ["test-util"] }
wreq = { workspace = true, features = ["ws"] }
