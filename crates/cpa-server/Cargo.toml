[package]
name = "cpa-server"
description = "HTTP surface of cliproxy-rs: routes, client auth, runtime and credential selection"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
async-compression = { version = "0.4", features = ["tokio", "gzip", "zlib", "deflate", "brotli", "zstd"] }
axum = { workspace = true, features = ["ws"] }
backtrace = { version = "0.3", optional = true }
bytes.workspace = true
btls = "0.5.6"
cpa-common.workspace = true
cpa-core.workspace = true
cpa-exec.workspace = true
cpa-plugin.workspace = true
cpa-translate.workspace = true
futures-util.workspace = true
gjson = "0.8.1"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
regex = "1"
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
serde_yaml_ng.workspace = true
socket2.workspace = true
tokio.workspace = true
tokio-btls = "0.5.6"
tokio-util = { version = "0.7", features = ["rt"] }
url = "2"
tower-service = "0.3"
tracing.workspace = true
tracing-subscriber.workspace = true
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1", features = ["v4"] }
zstd = { version = "0.14", default-features = false }
base64 = "0.22"
bcrypt = "0.19"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
getrandom = "0.3"
sha2 = "0.10"
subtle = "2.6"
wreq.workspace = true
# The live call body reports whether it reached the connection (realtime/http.rs).
http-body = "1"
# Codex Live WebRTC media relay (codex.live-media-relay), a pion port; ring crypto keeps
# a second BoringSSL out of the binary. Off by default.
webrtc = { version = "0.21", default-features = false, features = ["runtime-tokio", "crypto-ring"], optional = true }
# The relay names webrtc's codec and RTP types, which live in its private `rtc` core.
rtc = { version = "0.21", default-features = false, features = ["crypto-ring"], optional = true }
async-trait = { version = "0.1", optional = true }

# File change notifications (fs_events.rs): inotify and kqueue through libc, and
# ReadDirectoryChangesW on Windows. Both crates are already in the dependency tree.
[target.'cfg(unix)'.dependencies]
libc.workspace = true
# CPU sampling is never linked into default builds or published release binaries.
pprof = { version = "0.15", default-features = false, features = ["protobuf-codec"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading"] }

[features]
media-relay = ["dep:webrtc", "dep:rtc", "dep:async-trait"]
pprof = ["dep:pprof", "dep:backtrace"]

[dev-dependencies]
cpa-core = { workspace = true, features = ["test-support"] }
cpa-plugin = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["test-util"] }
wreq = { workspace = true, features = ["ws"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
