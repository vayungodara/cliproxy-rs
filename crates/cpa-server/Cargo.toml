[package]
name = "cpa-server"
description = "HTTP surface of cliproxy-rs: routes, client auth, runtime and credential selection"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
axum = { workspace = true, features = ["ws"] }
bytes.workspace = true
btls = "0.5.6"
cpa-common.workspace = true
cpa-core.workspace = true
cpa-exec.workspace = true
cpa-plugin.workspace = true
cpa-translate.workspace = true
futures-util.workspace = true
gjson = "0.8.1"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
regex = "1"
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
socket2.workspace = true
tokio.workspace = true
tokio-btls = "0.5.6"
tower-service = "0.3"
tracing.workspace = true
tracing-subscriber.workspace = true
tower = { version = "0.5", features = ["util"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
bcrypt = "0.19"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
getrandom = "0.3"
sha2 = "0.10"
subtle = "2.6"
wreq.workspace = true

[dev-dependencies]
cpa-plugin = { workspace = true, features = ["test-support"] }
url = "2"
tokio = { workspace = true, features = ["test-util"] }
wreq = { workspace = true, features = ["ws"] }
