<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="The management dashboard for cliproxy-rs." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preload" as="font" href="./fonts/public-sans.woff2" type="font/woff2" crossorigin />
    <title>cliproxy-rs · Management</title>
    <script>try { document.documentElement.dataset.theme = localStorage.getItem('cliproxy-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'); } catch {}</script>
  </head>
  <body><div id="app"></div><script type="module" src="/src/main.ts"></script></body>
</html>
