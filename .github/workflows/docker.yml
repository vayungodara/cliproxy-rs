# Builds the Docker image natively on linux/amd64 and linux/arm64. Pull requests and
# pushes to master build it without pushing when they change what the image build depends
# on besides the source: the Dockerfile, the build context filter, the manifests, the
# vendored crates and the dashboard that the binary embeds (ui/dist, read by
# crates/cpa-server/build.rs). This catches a Dockerfile that misses a new input before a
# tag does. release.yml builds the amd64 image before every release as well.
#
# A v* tag (path filters do not apply to tags) also pushes the image to
# ghcr.io/vayungodara/cliproxy-rs: each architecture as <version>-amd64 and
# <version>-arm64, then one multi-arch manifest tagged <version> and, unless the version
# has a pre-release suffix such as -rc1, latest. Only the publish job has packages: write,
# and it runs on tags only.
#
# One run per change: pushes to master, and pull requests through `pull_request` only.
# Runs are grouped per pull request (or per ref outside one), and a newer push cancels the
# older run.
name: docker

on:
  push:
    branches: [master]
    tags: ["v*"]
    paths:
      - Dockerfile
      - .dockerignore
      - Cargo.toml
      - Cargo.lock
      - crates/**/Cargo.toml
      - vendor/**
      - ui/dist/**
      - .github/workflows/docker.yml
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - Cargo.toml
      - Cargo.lock
      - crates/**/Cargo.toml
      - vendor/**
      - ui/dist/**
      - .github/workflows/docker.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/vayungodara/cliproxy-rs

jobs:
  # The build, smoke test and size gate of the docker job in release.yml, with the same
  # (default) build arguments, on a runner of each architecture: emulating arm64 under
  # QEMU takes hours for this Rust build.
  image:
    name: docker image ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" -t cliproxy-rs:ci .
      - name: Smoke test
        run: |
          reported="$(docker run --rm cliproxy-rs:ci --version | tail -n 1)"
          echo "$reported"
          if [[ "$GITHUB_REF" == refs/tags/v* && "$reported" != "cliproxy ${GITHUB_REF_NAME#v}" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the image's version ($reported)"; exit 1
          fi
      # amd64 keeps the key release.yml reports; arm64 reports under its own key.
      - name: Size gate
        run: bench/gate.sh image cliproxy-rs:ci ${{ matrix.arch == 'arm64' && 'arm64' || '' }}
      - name: Save the image for the publish job
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          docker tag cliproxy-rs:ci "$IMAGE:${GITHUB_REF_NAME#v}-${{ matrix.arch }}"
          docker save "$IMAGE:${GITHUB_REF_NAME#v}-${{ matrix.arch }}" | gzip -1 > image-${{ matrix.arch }}.tar.gz
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: image-${{ matrix.arch }}
          path: image-${{ matrix.arch }}.tar.gz
          retention-days: 1
          if-no-files-found: error

  publish:
    name: push to GHCR
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: image-*
          merge-multiple: true
      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Push both architectures and the manifest
        run: |
          version="${GITHUB_REF_NAME#v}"
          for arch in amd64 arm64; do
            docker load -i "image-$arch.tar.gz"
            docker push "$IMAGE:$version-$arch"
          done
          tags=(-t "$IMAGE:$version")
          [[ "$version" == *-* ]] || tags+=(-t "$IMAGE:latest")
          docker buildx imagetools create "${tags[@]}" \
            --annotation "index:org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --annotation "index:org.opencontainers.image.licenses=MIT" \
            "$IMAGE:$version-amd64" "$IMAGE:$version-arm64"
      - name: Check the manifest
        run: |
          version="${GITHUB_REF_NAME#v}"
          docker buildx imagetools inspect "$IMAGE:$version"
          platforms="$(docker buildx imagetools inspect "$IMAGE:$version" --format '{{json .Manifest}}' |
            jq -r '[.manifests[].platform | select(.os != "unknown") | .os + "/" + .architecture] | sort | join(",")')"
          echo "$platforms"
          [[ "$platforms" == "linux/amd64,linux/arm64" ]] || { echo "::error::manifest platforms are $platforms"; exit 1; }
