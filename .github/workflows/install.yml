# Published Unix releases retain the login-service smoke tests. Candidate binaries
# on all three systems exercise local checksummed releases, no-op checks, upgrades,
# rollback and direct Windows startup without waiting for the next release.
name: Installers

on:
  push:
    branches: [master]
    paths: [install.sh, install.ps1, .github/workflows/install.yml, .github/scripts/test-installers.py, .github/scripts/installer-fixture.rs, crates/cliproxy/**, crates/cpa-server/src/logging.rs]
  pull_request:
    paths: [install.sh, install.ps1, .github/workflows/install.yml, .github/scripts/test-installers.py, .github/scripts/installer-fixture.rs, crates/cliproxy/**, crates/cpa-server/src/logging.rs]
  workflow_dispatch:
    inputs:
      version:
        description: Release tag to install, such as v0.1.0, or latest
        default: latest

permissions:
  contents: read

# Pushes to master and pull requests, not both for the same commit; grouped per pull
# request so a newer push cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CLIPROXY_NO_OPEN: "1"
  VERSION: ${{ inputs.version || 'latest' }}

jobs:
  unix:
    name: install.sh (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install, as curl | sh does
        run: |
          [ "$VERSION" = latest ] || export CLIPROXY_VERSION="$VERSION"
          sh -s < install.sh
      - name: The server outlived the installer and answers with the generated keys
        run: |
          # shellcheck source=/dev/null
          . ~/.cliproxy-rs/keys.env
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          test "$CLIPROXY_PORT" = 8317
          test "$(find ~/.cliproxy-rs/keys.env ~/.cliproxy-rs/config.yaml -perm 600 | wc -l)" -eq 2
          test "$(code http://127.0.0.1:8317/healthz)" = 200
          test "$(code -H "Authorization: Bearer $CLIPROXY_CLIENT_KEY" http://127.0.0.1:8317/v1/models)" = 200
          test "$(code http://127.0.0.1:8317/v1/models)" = 401
          test "$(code -H "Authorization: Bearer $CLIPROXY_MANAGEMENT_KEY" http://127.0.0.1:8317/v8/management/config)" = 200
          test "$(code http://127.0.0.1:8317/management.html)" = 200
      - name: A current rerun keeps config, keys and the running server
        run: |
          [ "$VERSION" = latest ] || export CLIPROXY_VERSION="$VERSION"
          before=$(cksum ~/.cliproxy-rs/config.yaml ~/.cliproxy-rs/keys.env)
          old=$(cat ~/.cliproxy-rs/cliproxy.pid)
          sh install.sh
          test "$(cksum ~/.cliproxy-rs/config.yaml ~/.cliproxy-rs/keys.env)" = "$before"
          sh install.sh --check
          test "$(cat ~/.cliproxy-rs/cliproxy.pid)" = "$old"
          kill -0 "$old"
          curl -fsS http://127.0.0.1:8317/healthz
      - name: A second install moves to the next free port
        run: |
          [ "$VERSION" = latest ] || export CLIPROXY_VERSION="$VERSION"
          CLIPROXY_HOME="$RUNNER_TEMP/second" sh install.sh
          grep -qx CLIPROXY_PORT=8318 "$RUNNER_TEMP/second/keys.env"
          curl -fsS http://127.0.0.1:8318/healthz
          curl -fsS http://127.0.0.1:8317/healthz
          kill "$(cat "$RUNNER_TEMP/second/cliproxy.pid")"
      - name: Start at login (systemd user unit)
        if: runner.os == 'Linux'
        run: |
          [ "$VERSION" = latest ] || export CLIPROXY_VERSION="$VERSION"
          sudo loginctl enable-linger "$USER"
          XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export XDG_RUNTIME_DIR
          for _ in $(seq 1 20); do systemctl --user show-environment >/dev/null 2>&1 && break; sleep 1; done
          sh install.sh --service
          test ! -e ~/.cliproxy-rs/cliproxy.pid
          test "$(systemctl --user is-enabled cliproxy)$(systemctl --user is-active cliproxy)" = enabledactive
          curl -fsS http://127.0.0.1:8317/healthz
          sh install.sh
          test "$(systemctl --user is-active cliproxy)" = active
          systemctl --user disable --now cliproxy
      - name: Start at login (launchd agent)
        if: runner.os == 'macOS'
        run: |
          [ "$VERSION" = latest ] || export CLIPROXY_VERSION="$VERSION"
          agent="gui/$(id -u)/io.github.vayungodara.cliproxy-rs"
          sh install.sh --service
          test ! -e ~/.cliproxy-rs/cliproxy.pid
          launchctl print "$agent" | grep -q "state = running"
          curl -fsS http://127.0.0.1:8317/healthz
          sh install.sh
          launchctl print "$agent" | grep -q "state = running"
          curl -fsS http://127.0.0.1:8317/healthz
          launchctl bootout "$agent"
      - name: Diagnostics
        if: failure()
        run: |
          for h in ~/.cliproxy-rs "$RUNNER_TEMP/second"; do
            [ -d "$h" ] || continue
            echo "== $h"
            if [ -f "$h/cliproxy.pid" ]; then
              pid=$(cat "$h/cliproxy.pid")
              echo "pid file: $pid"
              ps -p "$pid" -o pid=,ppid=,comm=,args= || echo "process $pid is not running"
            else
              echo "no pid file"
            fi
            tail -n 40 "$h/cliproxy.log" || echo "no cliproxy.log"
          done
          (ss -ltnp 2>/dev/null || lsof -nP -iTCP -sTCP:LISTEN) | grep -E ':83[0-9]{2}' || echo "nothing listens on 8300-8399"
          if [ "$RUNNER_OS" = Linux ]; then XDG_RUNTIME_DIR="/run/user/$(id -u)" systemctl --user status cliproxy --no-pager || true; fi
          if [ "$RUNNER_OS" = macOS ]; then launchctl print "gui/$(id -u)/io.github.vayungodara.cliproxy-rs" || true; fi

  candidate:
    name: Local upgrade paths (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake clang libclang-dev perl
      - name: Build tools (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install nasm --no-progress -y
          printf '%s\n' 'C:\Program Files\NASM' >> "$GITHUB_PATH"
          printf '%s\n' 'LIBCLANG_PATH=C:\Program Files\LLVM\bin' >> "$GITHUB_ENV"
      - name: Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Build the candidate, not a release lacking --log-file
        run: cargo build --locked -p cliproxy
      - name: Build local release fixtures before network isolation
        run: |
          mkdir -p target/installer-fixtures
          suffix=''
          if [ "$RUNNER_OS" = Windows ]; then suffix='.exe'; fi
          rustc .github/scripts/installer-fixture.rs -o "target/installer-fixtures/hanging$suffix"
          rustc --cfg legacy .github/scripts/installer-fixture.rs -o "target/installer-fixtures/legacy$suffix"
          rustc --cfg plain_health .github/scripts/installer-fixture.rs -o "target/installer-fixtures/plain-health$suffix"
      - name: Linux installer tests with external network denied
        if: runner.os == 'Linux'
        run: |
          sudo env "PATH=$PATH" "HOME=$HOME" unshare --net -- sh -c 'ip link set lo up && exec setpriv --reuid="$1" --regid="$2" --init-groups -- python3 .github/scripts/test-installers.py target/debug/cliproxy' sh "$(id -u)" "$(id -g)"
      - name: macOS installer tests with external network denied
        if: runner.os == 'macOS'
        run: |
          sandbox-exec -p '(version 1)(allow default)(deny network-outbound)(allow network-outbound (remote ip "localhost:*"))' python3 .github/scripts/test-installers.py target/debug/cliproxy
      - name: Windows installer tests with external network denied
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $profiles = Get-NetFirewallProfile | Select-Object Name, DefaultOutboundAction
          $rulePrefix = "cliproxy-installer-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          function Measure-WindowsPowerShell($phase) {
            $clock = [Diagnostics.Stopwatch]::StartNew()
            $process = Start-Process powershell.exe -ArgumentList '-NoProfile -NonInteractive -Command 1' -NoNewWindow -PassThru
            try {
              $null = $process.Handle
              if (-not $process.WaitForExit(120000)) {
                $process.Kill()
                throw "Bare Windows PowerShell exceeded 120 seconds ($phase)"
              }
              if ($process.ExitCode -ne 0) { throw "Bare Windows PowerShell failed ($phase): $($process.ExitCode)" }
              Write-Host "Bare Windows PowerShell ($phase): $($clock.Elapsed.TotalSeconds.ToString('F1')) seconds"
            } finally { $process.Dispose() }
          }
          try {
            # Explicit block rules override allows. Use the profile default so
            # the runner can keep reporting while test programs use loopback.
            $runnerPaths = Get-Process -Name Runner.Listener, Runner.Worker |
              Select-Object -ExpandProperty Path -Unique
            if ($runnerPaths.Count -lt 2) { throw 'Could not locate both runner executables' }
            $i = 0
            foreach ($path in $runnerPaths) {
              New-NetFirewallRule -Name "$rulePrefix-runner-$i" -DisplayName "$rulePrefix-runner-$i" `
                -Direction Outbound -Action Allow -Program $path -Profile Any | Out-Null
              $i++
            }
            # Windows rejects ::1 in firewall rules. The installer suite checks
            # IPv6 loopback under this policy without an explicit address rule.
            New-NetFirewallRule -Name "$rulePrefix-loopback" -DisplayName "$rulePrefix-loopback" `
              -Direction Outbound -Action Allow -RemoteAddress '127.0.0.0/8' -Profile Any | Out-Null
            Measure-WindowsPowerShell 'before outbound block'
            Set-NetFirewallProfile -Profile Domain, Private, Public -DefaultOutboundAction Block
            Measure-WindowsPowerShell 'after outbound block'
            python .github/scripts/test-installers.py target/debug/cliproxy.exe
            if ($LASTEXITCODE -ne 0) { throw "Installer tests failed with exit $LASTEXITCODE" }
          } finally {
            # Restore connectivity before removing the runner exceptions, even
            # when the harness fails or a firewall command throws.
            try {
              foreach ($profile in $profiles) {
                Set-NetFirewallProfile -Profile $profile.Name -DefaultOutboundAction $profile.DefaultOutboundAction
              }
            } finally {
              Get-NetFirewallRule -Name "$rulePrefix-*" -ErrorAction SilentlyContinue | Remove-NetFirewallRule
            }
          }
