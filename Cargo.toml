[workspace]
resolver = "3"
members = ["crates/*"]
# Patched third-party crates (see vendor/README.md); not workspace members.
exclude = ["vendor"]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"
repository = "https://github.com/vayungodara/cliproxy-rs"
homepage = "https://github.com/vayungodara/cliproxy-rs"
categories = ["network-programming", "web-programming"]
# The Go reference recordings and fixtures stay in the repository; a published crate
# only needs to build.
exclude = ["tests/"]

[workspace.dependencies]
# The versions are for crates.io; a release bumps them with workspace.package.version.
cpa-common = { path = "crates/cpa-common", version = "0.4.0" }
cpa-core = { path = "crates/cpa-core", version = "0.4.0" }
cpa-exec = { path = "crates/cpa-exec", version = "0.4.0" }
cpa-home = { path = "crates/cpa-home", version = "0.4.0" }
cpa-plugin = { path = "crates/cpa-plugin", version = "0.4.0" }
cpa-server = { path = "crates/cpa-server", version = "0.4.0" }
cpa-store = { path = "crates/cpa-store", version = "0.4.0" }
cpa-translate = { path = "crates/cpa-translate", version = "0.4.0" }

anyhow = "1"
axum = "0.8.9"
bytes = "1"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
http = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
socket2 = "0.6"
tokio = { version = "1.53", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wreq = { version = "6.0.0-rc.31", features = ["stream", "json"] }

# Test builds only, two leaf crates: unoptimized, memchr's SIMD search (the Gemini schema
# goldens) and bcrypt's Blowfish rounds (every management key hash) took most of the
# slowest Go comparison tests' time. Debug assertions and overflow checks stay on, and the
# workspace's own crates, whose stack depth some tests bound, stay unoptimized.
[profile.test.package.memchr]
opt-level = 3

[profile.test.package.blowfish]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# gjson 0.8.1 with SIMD string scanning; behaviour unchanged (vendor/README.md). A patch
# applies to this workspace only: a build from crates.io uses upstream gjson 0.8.1.
[patch.crates-io]
gjson = { path = "vendor/gjson" }
